<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contact | Kavipriya C A</title>
<meta name="description" content="Get in touch with Kavipriya C A." />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="loading-screen" id="loadingScreen"><div class="loader-ring"></div></div>
  <div id="navbar-root"></div>

  <main id="main-content">
    <section class="page-hero" id="page-hero"></section>
    <section class="section">
      <div class="contact-grid">
        <div class="contact-info" id="contactInfoRoot"></div>
        <form class="contact-form glass-card" id="contactForm" novalidate>
          <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required />
            <span class="form-error" id="nameError" role="alert"></span>
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required />
            <span class="form-error" id="emailError" role="alert"></span>
          </div>
          <div class="form-group">
            <label for="subject">Subject</label>
            <input type="text" id="subject" name="subject" required />
            <span class="form-error" id="subjectError" role="alert"></span>
          </div>
          <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" required></textarea>
            <span class="form-error" id="messageError" role="alert"></span>
          </div>
          <button type="submit" class="btn btn-primary" id="submitBtn">Send Message</button>
          <p class="form-success" id="formSuccess" hidden>Message sent successfully! I'll get back to you soon.</p>
        </form>
      </div>
    </section>
  </main>

  <div id="footer-root"></div>
  <button id="backToTop" class="back-to-top" aria-label="Back to top">↑</button>

  <script src="js/profile.js"></script>
  <script src="js/components.js"></script>
  <script src="js/render-contact.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
